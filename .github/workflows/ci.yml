name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Vitest and WXT run on Node through their bin scripts.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: bun install --frozen-lockfile

      - run: bun run check
